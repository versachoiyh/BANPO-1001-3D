<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>BANPO 1001 - 3D Interior</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      touch-action: none;
    }
    #viewer {
      position: fixed;
      inset: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .title {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.86);
      padding: 10px 15px;
      border-radius: 8px;
      pointer-events: none;
    }
    .title strong {
      display: block;
      font-size: 16px;
    }
    .title span {
      font-size: 11px;
      color: #777;
    }
    #status {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,.88);
      color: #555;
      font-size: 13px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="viewer"></div>

  <div class="title">
    <strong>BANPO 1001</strong>
    <span>3D INTERIOR PREVIEW</span>
  </div>

  <div id="status">3D 모델 불러오는 중...</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('viewer');
    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f5);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.01,
      100000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.screenSpacePanning = true;
    controls.minDistance = 0.01;
    controls.maxDistance = 100000;

    // 부드러운 기본 조명
    scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b8b8, 2.2));

    const key = new THREE.DirectionalLight(0xffffff, 2.0);
    key.position.set(5, 10, 7);
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xffffff, 1.0);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    const loader = new GLTFLoader();

    loader.load(
      './BANPO-1001.glb',
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        // Online 3D Viewer와 비슷한 외곽선 효과.
        // 25° 이상 꺾이는 실제 모서리 위주로 표시하여
        // 불필요한 삼각형 선은 최대한 줄인다.
        const edgeMaterial = new THREE.LineBasicMaterial({
          color: 0x777777,
          transparent: true,
          opacity: 0.62,
          depthTest: true,
          depthWrite: false
        });

        model.traverse((obj) => {
          if (!obj.isMesh || !obj.geometry) return;

          // 기존 재질은 그대로 유지
          obj.castShadow = false;
          obj.receiveShadow = false;

          const edgesGeometry = new THREE.EdgesGeometry(obj.geometry, 25);
          const edges = new THREE.LineSegments(edgesGeometry, edgeMaterial);
          edges.renderOrder = 2;

          // Mesh의 자식으로 두면 위치/회전/스케일을 그대로 따라간다.
          obj.add(edges);
        });

        // 모델 전체가 화면에 들어오도록 자동 카메라 맞춤
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        const fov = camera.fov * Math.PI / 180;
        let distance = maxDim / (2 * Math.tan(fov / 2));
        distance *= 1.35;

        camera.near = Math.max(maxDim / 10000, 0.01);
        camera.far = Math.max(maxDim * 100, 1000);
        camera.updateProjectionMatrix();

        camera.position.set(
          center.x + distance * 0.72,
          center.y + distance * 0.58,
          center.z + distance * 0.82
        );

        controls.target.copy(center);
        controls.update();

        status.style.display = 'none';
      },
      (xhr) => {
        if (xhr.total) {
          const p = Math.round((xhr.loaded / xhr.total) * 100);
          status.textContent = `3D 모델 불러오는 중... ${p}%`;
        }
      },
      (err) => {
        console.error(err);
        status.textContent = '3D 모델을 불러오지 못했습니다.';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
