<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>BANPO 1001</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
#viewer{position:fixed;inset:0;background:#fff}
#viewer canvas{display:block;width:100%!important;height:100%!important}
#title{position:fixed;z-index:10;left:22px;top:18px;padding:10px 14px;border-radius:7px;
background:rgba(255,255,255,.90);box-shadow:0 1px 5px rgba(0,0,0,.06);pointer-events:none}
#title b{display:block;font-size:15px;color:#222}
#title span{font-size:10px;color:#777}
#loading{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);
background:rgba(255,255,255,.9);padding:10px 14px;border-radius:7px;color:#666;font-size:13px}
</style>
<script type="importmap">
{
 "imports":{
   "three":"https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.min.js",
   "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
   "three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
   "fflate":"https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/fflate.module.js",
   "o3dv":"https://cdn.jsdelivr.net/npm/online-3d-viewer@0.18.0/build/engine/o3dv.module.js"
 }
}
</script>
</head>
<body>
<div id="viewer"></div>
<div id="title"><b>BANPO 1001</b><span>3D INTERIOR PREVIEW</span></div>
<div id="loading">3D 모델 불러오는 중...</div>

<script type="module">
import * as OV from 'o3dv';

const parent = document.getElementById('viewer');
const loading = document.getElementById('loading');

const viewer = new OV.EmbeddedViewer(parent,{
  backgroundColor:new OV.RGBAColor(255,255,255,255),
  defaultColor:new OV.RGBColor(200,200,200),
  defaultLineColor:new OV.RGBColor(80,80,80),
  edgeSettings:new OV.EdgeSettings(true,new OV.RGBColor(95,95,95),1),
  onModelLoaded:()=>{
    loading.style.display='none';
  },
  onModelLoadFailed:()=>{
    loading.textContent='3DS 모델을 불러오지 못했습니다.';
  }
});

// GLB가 아니라 첫 화면에서 사용한 3DS 원본을 직접 읽습니다.
// GitHub 저장소에 아래 파일명을 그대로 올려 두세요.
viewer.LoadModelFromUrlList([
  './BANPO 10101 03.3ds'
]);

window.addEventListener('resize',()=>viewer.Resize());
</script>
</body>
</html>
