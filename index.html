<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>BANPO 1001</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
#viewer{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.badge{position:absolute;top:18px;left:20px;z-index:5;background:rgba(255,255,255,.90);
padding:10px 14px;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.05);pointer-events:none}
.badge b{display:block;font-size:15px;color:#222}.badge span{font-size:10px;color:#777}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:#666;
background:rgba(255,255,255,.9);padding:9px 12px;border-radius:6px;z-index:6}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="viewer"></div>
<div class="badge"><b>BANPO 1001</b><span>3D INTERIOR PREVIEW</span></div>
<div id="loading">3D 모델 불러오는 중...</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const host=document.getElementById('viewer');
const loading=document.getElementById('loading');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffffff);

// Online 3D Viewer 같은 도면/아이소메트릭 느낌을 위해 Orthographic 사용
const camera=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100000);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
host.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.screenSpacePanning=true;
controls.zoomSpeed=.8;
controls.rotateSpeed=.65;
controls.panSpeed=.7;

// 그림자 없이 밝고 균일한 뷰어 조명
scene.add(new THREE.HemisphereLight(0xffffff,0xd8d8d8,2.0));
const d1=new THREE.DirectionalLight(0xffffff,1.15);
d1.position.set(4,8,6); scene.add(d1);
const d2=new THREE.DirectionalLight(0xffffff,.45);
d2.position.set(-5,3,-4); scene.add(d2);

let model=null;
let modelCenter=new THREE.Vector3();
let modelSize=new THREE.Vector3();
let viewSize=1;

// Online 3D Viewer에 가까운 얇은 회색 선
const edgeMat=new THREE.LineBasicMaterial({
 color:0x6f7375,
 transparent:true,
 opacity:.78,
 depthTest:true,
 depthWrite:false
});

function fitCamera(){
 if(!model)return;
 const aspect=innerWidth/innerHeight;
 const pad=1.13;
 const horizontal=Math.max(modelSize.x,modelSize.z)*pad;
 const vertical=Math.max(modelSize.y, horizontal/aspect);
 viewSize=Math.max(horizontal/aspect,vertical);

 camera.left=-viewSize*aspect/2;
 camera.right=viewSize*aspect/2;
 camera.top=viewSize/2;
 camera.bottom=-viewSize/2;
 camera.near=Math.max(modelSize.length()/10000,.01);
 camera.far=Math.max(modelSize.length()*30,10000);
 camera.updateProjectionMatrix();

 // 캡처와 비슷한 위에서 내려보는 아이소메트릭 시점
 const dist=Math.max(modelSize.x,modelSize.y,modelSize.z)*2.5;
 camera.position.set(
   modelCenter.x+dist*.90,
   modelCenter.y+dist*.92,
   modelCenter.z+dist*1.05
 );
 camera.lookAt(modelCenter);
 controls.target.copy(modelCenter);
 controls.update();
}

new GLTFLoader().load('./BANPO-1001.glb',gltf=>{
 model=gltf.scene;
 scene.add(model);

 model.traverse(o=>{
   if(!o.isMesh || !o.geometry)return;

   // 원본 GLB 재질/색상은 유지하되 과도한 광택은 억제
   const mats=Array.isArray(o.material)?o.material:[o.material];
   mats.forEach(m=>{
     if(!m)return;
     if('roughness' in m) m.roughness=Math.max(m.roughness ?? .8,.72);
     if('metalness' in m) m.metalness=Math.min(m.metalness ?? 0,.15);
     m.side=THREE.DoubleSide;
   });

   // 실제로 꺾이는 모서리만 표시
   const eg=new THREE.EdgesGeometry(o.geometry,18);
   const lines=new THREE.LineSegments(eg,edgeMat);
   lines.renderOrder=10;
   o.add(lines);
 });

 const box=new THREE.Box3().setFromObject(model);
 modelCenter=box.getCenter(new THREE.Vector3());
 modelSize=box.getSize(new THREE.Vector3());

 fitCamera();
 loading.style.display='none';
},xhr=>{
 if(xhr.total){
   loading.textContent='3D 모델 불러오는 중... '+Math.round(xhr.loaded/xhr.total*100)+'%';
 }
},e=>{
 console.error(e);
 loading.textContent='3D 모델을 불러오지 못했습니다.';
});

addEventListener('resize',()=>{
 renderer.setSize(innerWidth,innerHeight);
 fitCamera();
});

renderer.setAnimationLoop(()=>{
 controls.update();
 renderer.render(scene,camera);
});
</script>
</body>
</html>
