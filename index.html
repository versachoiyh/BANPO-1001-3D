<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0">

  <title>BANPO 1001 - 3D Interior</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      background: #f5f5f5;
    }

    .title {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.85);
      padding: 10px 15px;
      border-radius: 8px;
    }

    .title strong {
      display: block;
      font-size: 16px;
    }

    .title span {
      font-size: 11px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="title">
    <strong>BANPO 1001</strong>
    <span>3D INTERIOR PREVIEW</span>
  </div>

  <model-viewer
    src="./BANPO-1001.glb"
    camera-controls
    touch-action="pan-y"
    interaction-prompt="auto"
    shadow-intensity="1"
    exposure="1"
    loading="eager">
  </model-viewer>

</body>
</html>
